name: Windows CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  DLL_ARTIFACT_NAME: SC4TerrainExtensions-dll-${{ github.sha }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dll:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Build DLL
        run: |
          cmake --preset vs2022-win32-release "-DSC4TE_VERSION_TAG=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}"
          cmake --build --preset vs2022-win32-release-build --target SC4TerrainExtensions --parallel

      - name: Smoke test build outputs
        shell: powershell
        run: |
          $dllPath = Join-Path "${{ github.workspace }}" "cmake-build-release-visual-studio\Release\SC4TerrainExtensions.dll"
          if (-not (Test-Path $dllPath)) {
            throw "Missing DLL output at $dllPath"
          }
          if ((Get-Item $dllPath).Length -le 0) {
            throw "DLL output is empty: $dllPath"
          }

          $datPath = Join-Path "${{ github.workspace }}" "dist\SC4TerrainExtensions.dat"
          if (-not (Test-Path $datPath)) {
            throw "Missing DAT payload at $datPath"
          }
          if ((Get-Item $datPath).Length -le 0) {
            throw "DAT payload is empty: $datPath"
          }

      - name: Generate SBOM for DLL (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: cmake-build-release-visual-studio/Release/SC4TerrainExtensions.dll
          format: spdx-json
          output-file: SC4TerrainExtensions.spdx.json
          upload-artifact: false

      - name: Stage raw DLL artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact-dll | Out-Null
          Copy-Item cmake-build-release-visual-studio\Release\SC4TerrainExtensions.dll artifact-dll\SC4TerrainExtensions.dll -Force
          Copy-Item SC4TerrainExtensions.spdx.json artifact-dll\SC4TerrainExtensions.spdx.json -Force

      - name: Upload raw DLL artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.DLL_ARTIFACT_NAME }}
          compression-level: 0
          path: |
            artifact-dll/SC4TerrainExtensions.dll
            artifact-dll/SC4TerrainExtensions.spdx.json

  package-installer:
    needs: [build-dll]
    runs-on: windows-2022
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Download DLL artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.DLL_ARTIFACT_NAME }}
          path: artifacts/dll

      - name: Assemble package
        shell: bash
        run: |
          mkdir -p dist-package

          dll_path="$(find artifacts/dll -type f -name SC4TerrainExtensions.dll | head -n 1)"
          sbom_path="$(find artifacts/dll -type f -name SC4TerrainExtensions.spdx.json | head -n 1)"
          if [ -z "$dll_path" ]; then
            echo "Could not find SC4TerrainExtensions.dll in downloaded artifact"
            find artifacts/dll -type f | sort
            exit 1
          fi
          if [ -z "$sbom_path" ]; then
            echo "Could not find SC4TerrainExtensions.spdx.json in downloaded artifact"
            find artifacts/dll -type f | sort
            exit 1
          fi

          cp "$dll_path" dist-package/SC4TerrainExtensions.dll
          cp "$sbom_path" dist-package/SC4TerrainExtensions.spdx.json
          cp dist/SC4TerrainExtensions.dat dist-package/SC4TerrainExtensions.dat
          cp dist/SC4TerrainExtensions.ini dist-package/SC4TerrainExtensions.ini
          cp dist/README.txt dist-package/
          cp LICENSE.txt dist-package/
          cp dist/THIRD_PARTY_NOTICES.txt dist-package/
          cp dist/SC4TerrainExtensionsInstaller.nsi dist-package/

          echo "Package contents:"
          find dist-package -type f | sort

      - name: Smoke test package inputs
        shell: powershell
        run: |
          $packageDir = Join-Path "${{ github.workspace }}" "dist-package"
          $requiredFiles = @(
            "SC4TerrainExtensions.dll",
            "SC4TerrainExtensions.dat",
            "SC4TerrainExtensions.spdx.json",
            "SC4TerrainExtensionsInstaller.nsi",
            "README.txt",
            "LICENSE.txt",
            "THIRD_PARTY_NOTICES.txt"
          )
          foreach ($file in $requiredFiles) {
            $path = Join-Path $packageDir $file
            if (-not (Test-Path $path)) {
              throw "Missing package input: $path"
            }
            if ((Get-Item $path).Length -le 0) {
              throw "Package input is empty: $path"
            }
          }

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        shell: powershell
        run: |
          $rootDir = "${{ github.workspace }}"
          $refName = "${{ github.ref_name }}"
          $version = if ($refName -match '^v(.+)') { $Matches[1] } else { "${{ github.sha }}".Substring(0, 7) }
          $minRenderServicesVersionPath = Join-Path $rootDir "dist\MIN_SC4_RENDER_SERVICES.txt"
          $minRenderServicesVersion = (Get-Content -Path $minRenderServicesVersionPath -Raw).Trim()
          if ($minRenderServicesVersion -notmatch '^v?(\d+)\.(\d+)\.(\d+)$') {
            throw "Invalid SC4 Render Services minimum version in ${minRenderServicesVersionPath}: '$minRenderServicesVersion'"
          }
          $minRenderServicesMajor = $Matches[1]
          $minRenderServicesMinor = $Matches[2]
          $minRenderServicesBuild = $Matches[3]
          Write-Host "Building installer for version: $version"
          Write-Host "Minimum SC4 Render Services version: $minRenderServicesMajor.$minRenderServicesMinor.$minRenderServicesBuild"
          Set-Location dist-package
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DAPP_VERSION=$version `
            /DMIN_RENDER_SERVICES_VERSION_MAJOR=$minRenderServicesMajor `
            /DMIN_RENDER_SERVICES_VERSION_MINOR=$minRenderServicesMinor `
            /DMIN_RENDER_SERVICES_VERSION_BUILD=$minRenderServicesBuild `
            SC4TerrainExtensionsInstaller.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          $installer = Get-ChildItem -Filter "SC4TerrainExtensions-*-Setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer was not produced"
          }
          if ($installer.Length -le 0) {
            throw "Installer is empty: $($installer.FullName)"
          }
          Write-Host "Installer contents:"
          Get-ChildItem -Filter "*.exe" | Select-Object Name, Length

      - name: Generate SHA256 checksums
        shell: powershell
        run: |
          Set-Location dist-package
          $installer = Get-ChildItem -Filter "SC4TerrainExtensions-*-Setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer was not produced"
          }
          $targets = @(
            $installer.Name,
            "SC4TerrainExtensions.dll",
            "SC4TerrainExtensions.dat",
            "SC4TerrainExtensions.spdx.json",
            "README.txt",
            "LICENSE.txt",
            "THIRD_PARTY_NOTICES.txt"
          )
          $lines = foreach ($target in $targets) {
            if (-not (Test-Path $target)) {
              throw "Cannot hash missing package file: $target"
            }
            $hash = Get-FileHash -Algorithm SHA256 -Path $target
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $target
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SC4TerrainExtensions-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
          compression-level: 0
          path: dist-package/

  validate-tag:
    name: Validate Release Tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate version tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH[-PRERELEASE], for example v1.0.0 or v1.0.0-rc.1. Got: $TAG_NAME"
            exit 1
          fi

  release:
    needs: [package-installer, validate-tag]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      # For the signed attestations.
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SC4TerrainExtensions-${{ github.ref_name }}
          path: dist-package

      - name: Create release zip
        run: |
          VERSION=${{ github.ref_name }}
          zip -j SC4TerrainExtensions-${VERSION}.zip \
            dist-package/SC4TerrainExtensions-*-Setup.exe \
            dist-package/README.txt \
            dist-package/LICENSE.txt \
            dist-package/THIRD_PARTY_NOTICES.txt \
            dist-package/SC4TerrainExtensions.spdx.json \
            dist-package/SHA256SUMS.txt

      # Build provenance: proves that this workflow built these files from this commit. Check a download
      # with `gh attestation verify <file> --repo ${{ github.repository }}`.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            SC4TerrainExtensions-${{ github.ref_name }}.zip
            dist-package/SC4TerrainExtensions-*-Setup.exe
            dist-package/SC4TerrainExtensions.dll

      # Links the SBOM to the DLL, the installer and the zip.
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            SC4TerrainExtensions-${{ github.ref_name }}.zip
            dist-package/SC4TerrainExtensions-*-Setup.exe
            dist-package/SC4TerrainExtensions.dll
          sbom-path: dist-package/SC4TerrainExtensions.spdx.json

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            SC4TerrainExtensions-${{ github.ref_name }}.zip
            dist-package/SC4TerrainExtensions.spdx.json
            dist-package/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The action publishes prereleases before uploading assets, which immutable releases reject.
          # Keep them as drafts and publish below once the assets are in.
          draft: ${{ contains(github.ref_name, '-') }}

      - name: Publish prerelease
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false

  # Points the sc4pac package at the new release on a branch of caspervg/simtropolis-channel, and
  # links to a prefilled pull request in the job summary. Prereleases never reach sc4pac, so they
  # don't get the fork token either.
  sc4pac:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: sc4pac
    concurrency: sc4pac-caspervg-sc4-terrain-extension
    steps:
      - uses: caspervg/sc4pac-release-action@af95bc5692cab0a3b32e50aac5b82eb8249ffca9 # v1.0.0
        with:
          channel: sebamarynissen/simtropolis-channel
          asset-id: caspervg-sc4-terrain-extension
          asset-name: SC4TerrainExtensions-${{ github.ref_name }}.zip
          token: ${{ secrets.SC4PAC_FORK_TOKEN }}
